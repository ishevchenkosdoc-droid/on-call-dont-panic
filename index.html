<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ON CALL: DON'T PANIC</title>
<style>:root{--bg:#091017;--card:#131c26;--line:#293746;--text:#edf3f8;--muted:#91a0b2;--red:#ff6464;--green:#6ee7a8;--blue:#8ec8ff;--amber:#ffc86a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:840px;margin:auto;padding:22px}.brand{color:var(--red);font-weight:900;letter-spacing:2px}.tag,.small{color:var(--muted)}h1{font-size:32px;line-height:1.08;margin:8px 0}h2{margin:16px 0 8px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.case,.btn{cursor:pointer}.case:hover,.btn:hover{border-color:#60758e}.shiftno{font-size:12px;color:var(--red);font-weight:900;letter-spacing:1.3px}.vitals{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{background:#0c141d;border:1px solid #334357;padding:8px 10px;border-radius:10px}.bad{border-color:#8a4343;color:#ffd0d0}.btn{display:block;width:100%;text-align:left;background:#18232f;color:var(--text);border:1px solid #34465a;border-radius:13px;padding:14px;margin:9px 0;font-size:15px}.newtag{font-size:10px;font-weight:900;color:var(--green);letter-spacing:1px;margin-bottom:5px}.done{opacity:.43;cursor:default}.repeat{border-color:#50677f}.result{border-left:3px solid var(--blue)}.event{border-left:3px solid var(--red);background:#21181c}.pending{border-left:3px solid var(--amber)}.good{border-left:3px solid var(--green)}.back{color:var(--blue);cursor:pointer}.score{font-size:44px;font-weight:900}.grade{font-size:18px;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{text-align:center}.stat b{font-size:22px;display:block}.history{font-size:13px;color:#bac5d1}.history div{padding:7px 0;border-bottom:1px solid #263442}.critical{color:#ff9d9d}.positive{color:#8df0b8}.footer{font-size:12px;color:#6e7d8d;margin:28px 0}.section{font-size:12px;color:#95a7ba;font-weight:900;letter-spacing:1px;margin-top:18px}.outcome{font-size:20px;font-weight:900}.locked{opacity:.6}.hint{font-size:13px;color:#b7c3d0}.badge{display:inline-block;padding:7px 10px;border:1px solid #40546a;border-radius:999px;margin:4px 4px 0 0;font-size:12px}@media(max-width:560px){.two{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><div class="wrap" id="app"></div>
<script>
const C={
ectopic:{time:'03:12',title:'Not Everything Is Appendicitis',tease:'27F · lower abdominal pain · dizziness · BP 82/51',intro:'A 27-year-old woman arrives with severe lower abdominal pain and dizziness. She is pale, clammy and frightened. The ambulance doctor announces: “Obviously appendicitis.”',dx:'Ruptured ectopic pregnancy with haemorrhagic shock',base:[82,51,128],deadline:12,initial:['abc','history','exam','bloods','preg','gyn','senior','ct','argue'],rationale:'The decisive pattern was haemodynamic instability in a woman of reproductive age, followed by pregnancy confirmation and intraperitoneal free fluid. Resuscitation and early specialty/senior escalation should run in parallel with focused diagnosis; avoidable delay in a shocked patient is dangerous.',refs:['NICE NG126 — Ectopic pregnancy and miscarriage: diagnosis and initial management (updated 2026).','RCOG Green-top Guideline No. 21 — Diagnosis and Management of Ectopic Pregnancy (current published guideline; update in development).'],actions:{abc:['ABCDE + monitoring + two large-bore IV lines',3,12,'Monitoring and IV access are established. She remains shocked.',['resus','reassess']],history:['Focused history',2,8,'LMP was about 7 weeks ago. She has had light vaginal spotting since yesterday.',['preg']],exam:['Focused abdominal examination',2,6,'Lower abdominal tenderness with guarding, maximal on the right.',['preg']],bloods:['CBC, group & crossmatch, renal profile',2,6,'Samples are sent.',['resus'],false,{delay:5,text:'Hb 9.4 g/dL. Crossmatch is in progress.'}],preg:['Pregnancy test / β-hCG',2,14,'Urine pregnancy test is positive.',['us','gyn']],us:['Bedside pelvic/FAST assessment',3,18,'There is significant free intraperitoneal fluid. No definite intrauterine pregnancy is seen on this rapid bedside assessment.',['gyn','theatre']],gyn:['Call gynaecology',2,8,'GYNAECOLOGY: “Tell me how unstable she is and what you know so far.”',['reassess'],true],senior:['Call senior surgical/ED help',2,10,'Senior help is on the way.',['resus']],resus:['Activate haemorrhage resuscitation / request blood products',3,15,'Haemorrhage resuscitation is activated and blood products are requested.',['theatre']],reassess:['Reassess patient',2,7,'She is still hypotensive and increasingly drowsy.',['us'],true],theatre:['Escalate for immediate definitive operative management',2,30,'Gynaecology, anaesthesia and theatre are mobilised urgently.',['END']],ct:['Send for routine CT abdomen/pelvis before escalation',12,-30,'The trip consumes precious time in a profoundly unstable patient.',['resus','us']],argue:['Argue about whether this is appendicitis',4,-8,'+2 emotional satisfaction. 0 haemodynamic benefit.',['reassess']]}},
sbo:{time:'01:46',title:'The Quiet Hernia',tease:'71F · vomiting · distension · previous laparotomy',intro:'A 71-year-old woman has repeated bilious vomiting, abdominal distension and worsening pain. Previous midline laparotomy. “Probably adhesions,” someone says.',dx:'Strangulating small-bowel obstruction from an incarcerated groin hernia',base:[101,64,112],deadline:17,initial:['abc','history','abdexam','groin','labs','ng','ct','wait'],rationale:'The key was not simply diagnosing SBO, but identifying features suggesting strangulation and a mechanical cause requiring urgent surgery. A complete examination includes hernial orifices. Resuscitation, decompression when appropriate, imaging and early surgical decision-making occur in parallel when bowel compromise is suspected.',refs:['World Society of Emergency Surgery — Bologna guidelines for diagnosis and management of adhesive small bowel obstruction: 2017 update.'],actions:{abc:['ABCDE, IV access, fluids and monitoring',3,10,'Resuscitation begins. She is clinically dehydrated and tachycardic.',['reassess']],history:['Focused history including operations and bowel function',2,5,'No flatus since yesterday. Pain began colicky but is now more continuous.',['abdexam']],abdexam:['Abdominal examination',2,6,'Distended abdomen, high-pitched sounds, diffuse tenderness. No frank peritonism yet.',['groin']],groin:['Examine hernial orifices',2,20,'A small, exquisitely tender, irreducible right femoral-region lump is found.',['senior','theatre']],labs:['CBC, electrolytes, renal profile, gas/lactate',2,5,'Samples are sent.',['reassess'],false,{delay:6,text:'AKI and elevated lactate are reported.'}],ng:['NPO + nasogastric decompression',3,7,'Large-volume bilious aspirate. Distension improves slightly; focal pain persists.',['reassess']],ct:['Urgent contrast CT while resuscitating',3,10,'CT is requested urgently.',['senior'],false,{delay:8,text:'CT: closed-loop small-bowel obstruction with reduced enhancement and mesenteric oedema, concerning for ischaemia.',unlock:['theatre']}],senior:['Call senior surgeon + anaesthesia',2,14,'Senior agrees this cannot wait for the morning team.',['theatre']],reassess:['Repeat examination',2,7,'Pain is now continuous and focal tenderness is worse.',['groin'],true],theatre:['Proceed toward urgent operative management',2,30,'Emergency theatre is mobilised while resuscitation continues.',['END']],wait:['Observe overnight because “adhesions usually settle”',20,-38,'She becomes hypotensive with worsening tenderness. The bowel did not read your observation plan.',['senior','theatre']]}},
ppu:{time:'04:08',title:'The Board-Like Abdomen',tease:'54M · sudden epigastric pain · rigid abdomen',intro:'A 54-year-old man develops sudden severe epigastric pain. Regular NSAID use. He lies perfectly still and asks you not to touch his abdomen again.',dx:'Perforated peptic ulcer with generalised peritonitis',base:[96,58,119],deadline:15,initial:['abc','history','exam','labs','abx','ct','senior','ppi','xray'],rationale:'Generalised peritonitis with sudden upper abdominal pain should trigger immediate resuscitation, antimicrobial treatment, urgent imaging when it does not delay necessary source control, and early surgical/anaesthetic escalation. Non-operative delay is inappropriate in a deteriorating patient with diffuse peritonitis.',refs:['World Society of Emergency Surgery — Perforated and bleeding peptic ulcer: WSES guidelines (2020).'],actions:{abc:['ABCDE, IV access and resuscitation',3,11,'Resuscitation begins. He remains tachycardic.',['reassess']],history:['Focused history',2,5,'Frequent ibuprofen use. Sudden onset, no previous similar episode.',['exam']],exam:['Focused abdominal examination',2,10,'Board-like rigidity with generalised guarding and rebound tenderness.',['senior','abx']],labs:['Bloods, gas/lactate and crossmatch',2,5,'Samples are sent.',['reassess'],false,{delay:5,text:'Lactate is elevated; inflammatory markers and renal function are abnormal.'}],abx:['Start appropriate IV broad-spectrum antimicrobial therapy',3,12,'Antimicrobial therapy begins while source control is pursued.',['senior']],ct:['Urgent CT abdomen/pelvis',3,8,'CT is requested.',['senior'],false,{delay:7,text:'CT shows free intraperitoneal gas and fluid with suspected gastroduodenal perforation.',unlock:['theatre']}],senior:['Call senior surgeon + anaesthesia',2,12,'Senior: “Keep resuscitating. We need source control.”',['theatre']],reassess:['Reassess after initial measures',2,6,'Still rigid, colder and more tachycardic.',['theatre'],true],theatre:['Prepare for urgent operative source control',2,30,'Emergency theatre pathway is activated.',['END']],ppi:['Give PPI and reassess in the morning',20,-40,'Peritonitis does not negotiate with the ward round. He deteriorates.',['senior','theatre']],xray:['Obtain serial plain films before deciding',10,-15,'You obtain more pictures and less time. The abdomen remains rigid.',['ct']]}},
ami:{time:'02:23',title:'Pain That Does Not Add Up',tease:'76M · AF · severe pain · surprisingly soft abdomen',intro:'A 76-year-old man with atrial fibrillation describes unbearable diffuse abdominal pain. The abdomen is relatively soft with modest tenderness.',dx:'Acute mesenteric ischemia from arterial occlusion',base:[118,72,108],deadline:19,initial:['abc','history','exam','labs','cta','senior','analgesia','observe'],rationale:'Severe pain out of proportion to early abdominal findings in a high-risk patient should raise suspicion for acute mesenteric ischaemia. CTA should not be delayed when AMI is suspected; laboratory markers, including lactate, cannot safely exclude early disease. Definitive vascular/surgical management is time-critical.',refs:['World Society of Emergency Surgery — Acute mesenteric ischemia: updated guidelines (2022).'],actions:{abc:['ABCDE + IV access + monitoring',3,8,'He looks much sicker than the abdominal examination suggests.',['reassess']],history:['Focused vascular/cardiac history',2,8,'Persistent atrial fibrillation; anticoagulation was stopped several days ago for a dental procedure.',['cta']],exam:['Focused abdominal and vascular examination',2,6,'Diffuse pain with only mild tenderness. No convincing peritonism yet.',['cta']],labs:['CBC, metabolic panel, blood gas/lactate',2,4,'Samples are sent.',['cta'],false,{delay:6,text:'Lactate is elevated, but this does not establish or exclude bowel viability.'}],cta:['Urgent CT angiography',3,15,'CTA is requested immediately.',['senior'],false,{delay:7,text:'CTA shows acute superior mesenteric arterial occlusion with threatened bowel.',unlock:['vascular','abx']}],senior:['Call senior surgical help',2,10,'Senior is coming and shares your concern.',['cta']],vascular:['Immediate vascular/interventional escalation',2,20,'Urgent revascularisation and operative planning begins.',['theatre']],abx:['Start broad-spectrum antibiotics',3,8,'Antimicrobial treatment begins while definitive management is organised.',['theatre']],reassess:['Repeat abdominal examination',2,5,'Tenderness is increasing. The window is narrowing.',['cta'],true],theatre:['Proceed to definitive urgent management pathway',2,30,'Definitive treatment is mobilised.',['END']],analgesia:['Analgesia and wait to see whether pain settles',12,-22,'The pain persists. The soft abdomen has provided false reassurance.',['reassess','cta']],observe:['Admit for observation and repeat lactate later',25,-45,'He becomes hypotensive and peritonitic. The window for bowel salvage is closing.',['cta','vascular']]}},
aaa:{time:'05:31',title:'Back Pain, Until It Isn’t',tease:'72M · sudden back/abdominal pain · collapse · BP 78/48',intro:'A 72-year-old man with a smoking history collapses with sudden abdominal and back pain. He is grey, sweaty and barely able to answer.',dx:'Ruptured abdominal aortic aneurysm',base:[78,48,124],deadline:9,initial:['abc','history','exam','us','vascular','cta','fluids','renal'],rationale:'In a shocked older patient with new abdominal/back pain, ruptured AAA must be considered immediately. NICE recommends immediate bedside aortic ultrasound and immediate discussion with a regional vascular service if AAA is seen, ultrasound is unavailable/non-diagnostic, or suspicion persists. Transfer and repair planning should not be unnecessarily delayed.',refs:['NICE NG156 — Abdominal aortic aneurysm: diagnosis and management (2020).'],actions:{abc:['ABCDE + monitoring + rapid IV access',2,10,'Profound circulatory shock is confirmed.',['us','vascular']],history:['Focused history while resuscitation proceeds',2,5,'Long smoking history, hypertension, sudden onset during the night.',['us']],exam:['Focused abdominal/vascular examination',2,6,'Tender abdomen; a pulsatile mass is suspected but examination is difficult.',['us','vascular']],us:['Immediate bedside aortic ultrasound',3,28,'A large abdominal aortic aneurysm is visualised.',['vascular']],vascular:['Discuss immediately with regional vascular service',2,30,'The vascular team accepts him for emergency assessment and repair pathway.',['transfer']],transfer:['Activate immediate transfer / repair pathway',2,30,'Emergency transfer and repair pathway is activated without avoidable delay.',['END']],cta:['Arrange CTA before speaking to vascular',12,-25,'CTA may help repair planning, but specialist activation has been delayed in a profoundly unstable patient.',['vascular']],fluids:['Give litres of crystalloid until BP is normal',8,-22,'Aggressive volume loading consumes time and conflicts with a restrictive resuscitation approach during emergency transfer.',['vascular']],renal:['Wait for creatinine before referral',10,-30,'The aneurysm continues to leak while the laboratory remains admirably thorough.',['vascular']]}}
};
let S=null;
const $=()=>document.getElementById('app');
function home(){$().innerHTML=`<div class=brand>ON CALL: DON'T PANIC</div><h1>You know the textbook.<br>Now survive the night.</h1><p class=tag>Five emergency shifts. No single-choice quiz. The patient changes while you decide.</p>${Object.values(C).map((c,i)=>`<div class="card case" onclick="start('${Object.keys(C)[i]}')"><div class=shiftno>SHIFT ${i+1} · ${c.time}</div><h2>${c.title}</h2><div>${c.tease}</div><p class=small>Take the call →</p></div>`).join('')}<div class=footer>Educational simulation only. Not clinical decision support. Local protocols and patient-specific senior/specialty judgement remain essential.</div>`}
function start(id){let c=C[id];S={id,c,time:0,score:50,bp:c.base[0],dia:c.base[1],hr:c.base[2],done:new Set(),seen:new Set(c.initial),newly:new Set(),history:[],last:null,critical:[],pending:[],ended:false,eventLevel:0,good:[]};render()}
function unlock(arr=[]){arr.forEach(x=>{if(x==='END'){finish();return}if(!S.seen.has(x)){S.seen.add(x);S.newly.add(x)}})}
function action(id){if(!S||S.ended)return;let a=S.c.actions[id];if(!a)return;let [label,min,pts,msg,next,repeat,pending]=a;S.time+=min;S.score+=pts;S.last=msg;S.history.push({t:S.time,label});S.newly.clear();if(!repeat)S.done.add(id);if(pts<=-20&&!S.critical.includes(label))S.critical.push(label);if(pts>=14&&!S.good.includes(label))S.good.push(label);unlock(next);if(pending)S.pending.push({at:S.time+pending.delay,text:pending.text,unlock:pending.unlock||[]});tick();render()}
function tick(){let arrived=S.pending.filter(p=>p.at<=S.time);S.pending=S.pending.filter(p=>p.at>S.time);arrived.forEach(p=>{S.last=(S.last?S.last+'\n\n':'')+'RESULT: '+p.text;unlock(p.unlock)});let over=S.time-S.c.deadline;if(over>=0){let lvl=1+Math.floor(over/7);if(lvl>S.eventLevel){S.eventLevel=lvl;S.score-=lvl===1?6:10}S.bp=Math.max(58,S.c.base[0]-7*lvl);S.dia=Math.max(30,S.c.base[1]-5*lvl);S.hr=Math.min(158,S.c.base[2]+8*lvl)}if(S.time>=S.c.deadline+28&&!S.ended){S.score-=25;S.critical.push('Definitive escalation was excessively delayed');finish(true)}}
function finish(bad=false){S.ended=true;S.badOutcome=bad;S.score=Math.max(0,Math.min(100,S.score))}
function grade(n){return n>=88?'Controlled the shift':n>=72?'Safe shift, some inefficiency':n>=55?'You survived. Read the debrief.':'The night won this round.'}
function eventText(){let m={ectopic:['She becomes more drowsy. Shock is worsening.','Her pressure is collapsing despite initial measures.'],sbo:['Pain is now continuous and focal tenderness is worse.','She looks toxic; peritoneal signs are developing.'],ppu:['He is colder and more tachycardic. The abdomen remains rigid.','Shock is worsening while source control is delayed.'],ami:['Tenderness is increasing. The mismatch is disappearing for the wrong reason.','He is becoming hypotensive and peritonitic.'],aaa:['He becomes less responsive.','Profound shock is progressing.']}[S.id];return m[Math.min(S.eventLevel-1,m.length-1)]}
function button(id){let a=S.c.actions[id],done=S.done.has(id),nw=S.newly.has(id),repeat=a[5];if(done)return `<button class="btn done" disabled>✓ DONE — ${a[0]}</button>`;return `<button class="btn ${repeat?'repeat':''}" onclick="action('${id}')">${nw?'<span class=newtag>NEW OPTION</span>':''}${a[0]}</button>`}
function render(){if(!S)return home();if(S.ended)return debrief();let c=S.c;let actions=[...S.seen].filter(x=>c.actions[x]);let pend=S.pending.length?`<div class="card pending"><b>⏳ PENDING</b>${S.pending.map(p=>`<p class=small>Investigation/result expected in ~${Math.max(1,p.at-S.time)} simulated min.</p>`).join('')}</div>`:'';$().innerHTML=`<span class=back onclick=home()>← All shifts</span><div class=brand>${c.time} · ${c.title}</div><div class=card><p>${c.intro}</p><div class=vitals><span class="pill ${S.eventLevel?'bad':''}">BP ${S.bp}/${S.dia}</span><span class="pill ${S.eventLevel?'bad':''}">HR ${S.hr}</span><span class=pill>+${S.time} min</span></div></div>${S.last?`<div class="card result"><b>WHAT HAPPENS</b><p style="white-space:pre-line">${S.last}</p></div>`:''}${S.eventLevel?`<div class="card event"><b>⚠ PATIENT UPDATE</b><p>${eventText()}</p><div class=vitals><span class="pill bad">BP ${S.bp}/${S.dia}</span><span class="pill bad">HR ${S.hr}</span></div></div>`:''}${pend}<h2>WHAT DO YOU DO NEXT?</h2><p class=small>Previously available actions stay visible when they remain possible. New options appear as information arrives.</p>${actions.map(button).join('')}<div class=footer>Guideline references remain hidden until debrief to avoid diagnostic spoilers.</div>`}
function debrief(){let c=S.c;let outcome=S.badOutcome?'The patient deteriorated critically before definitive escalation.':'Definitive escalation was reached.';$().innerHTML=`<span class=back onclick=home()>← All shifts</span><div class=brand>SHIFT DEBRIEF</div><div class="card ${S.badOutcome?'event':'good'}"><div class=score>${S.score}/100</div><div class=grade>${grade(S.score)}</div><h2>${c.dx}</h2><p class=outcome>${outcome}</p><p>Time: <b>${S.time} simulated minutes</b>.</p><p class=small>This score evaluates choices inside this educational scenario, not clinical competence.</p></div><div class=card><h3>Why this case mattered</h3><p>${c.rationale}</p></div><div class=two><div class="card stat"><b>${S.time} min</b><span class=small>elapsed</span></div><div class="card stat"><b>${S.done.size}</b><span class=small>completed actions</span></div></div><div class=card><h3>Strong decisions</h3>${S.good.length?S.good.map(x=>`<p class=positive>✓ ${x}</p>`).join(''):'<p class=small>No high-value action was recorded before escalation.</p>'}<h3>Critical detours</h3>${S.critical.length?[...new Set(S.critical)].map(x=>`<p class=critical>• ${x}</p>`).join(''):'<p class=positive>No major time-wasting detour recorded.</p>'}</div><div class=card><h3>Your shift</h3><div class=history>${S.history.map(x=>`<div>+${x.t} min — ${x.label}</div>`).join('')}</div></div><div class=card><h3>Bibliography</h3>${c.refs.map(r=>`<p>${r}</p>`).join('')}<p class=small>References appear only after the case. Scenario wording is original and does not reproduce guideline algorithms.</p></div><button class=btn onclick="start('${S.id}')">↻ Replay this shift</button><button class=btn onclick=home()>← Choose another shift</button>`}
home();
</script></body></html>
